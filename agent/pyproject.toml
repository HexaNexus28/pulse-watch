[project]
name = "pulsewatch-digest-agent"
version = "0.1.0"
description = "ADK agent that turns raw RSS articles into a sourced, deduplicated daily digest"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.8.0",
    "litellm>=1.60",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digest_agent"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
