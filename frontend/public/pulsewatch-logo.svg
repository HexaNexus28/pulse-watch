<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGradient)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Pulse wave lines representing RSS/data flow -->
  <path d="M 12 32 Q 20 24, 28 32 T 44 32 T 52 32" 
        stroke="url(#pulseGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.9">
    <animate attributeName="d" 
             values="M 12 32 Q 20 24, 28 32 T 44 32 T 52 32;
                     M 12 32 Q 20 40, 28 32 T 44 32 T 52 32;
                     M 12 32 Q 20 24, 28 32 T 44 32 T 52 32"
             dur="2s" 
             repeatCount="indefinite"/>
  </path>
  
  <!-- Trend chart line -->
  <polyline points="16,40 24,36 32,28 40,24 48,20" 
            stroke="url(#chartGradient)" 
            stroke-width="2.5" 
            fill="none" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.8"/>
  
  <!-- Data points on the trend line -->
  <circle cx="16" cy="40" r="2" fill="#10B981"/>
  <circle cx="24" cy="36" r="2" fill="#10B981"/>
  <circle cx="32" cy="28" r="2.5" fill="#059669"/>
  <circle cx="40" cy="24" r="2" fill="#10B981"/>
  <circle cx="48" cy="20" r="2" fill="#10B981"/>
  
  <!-- Central monitoring eye/watch symbol -->
  <g transform="translate(32, 32)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="#1D4ED8"/>
  </g>
  
  <!-- RSS signal waves -->
  <g transform="translate(32, 32)" opacity="0.6">
    <path d="M -6 -6 Q 0 -8, 6 -6" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -10 -10 Q 0 -13, 10 -10" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
